name: Release APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests & build release APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "LibreFlow-${{ github.ref_name }}-arm64.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: LibreFlow-${{ github.ref_name }}-arm64.apk
          generate_release_notes: true
